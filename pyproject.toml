[build-system]
requires = ["setuptools>=77.0"]  # PEP 639 license metadata
build-backend = "setuptools.build_meta"

[project]
name = "django_rest_aggregation"
version = "0.4.0"
authors = [
    { name = "Simon Legtenborg", email = "simon.legtenborg@singular-it.de" },
]
description = "A DRF mixin for aggregation endpoints"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "Django>=5.2",
    "djangorestframework>=3.16",
    "django-filter>=25.1",
    "djangorestframework-stubs>=3.18.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Operating System :: OS Independent",
]
[project.urls]
"Homepage" = "https://github.com/singularit-de/django-rest-aggregation/"
"Bug Tracker" = "https://github.com/singularit-de/django-rest-aggregation/issues"

[dependency-groups]
dev = [
    "coverage>=7.16",
    "pre-commit>=4.6.2",
    "ruff>=0.17",
    "ty>=0.0.88",
]
postgres = ["psycopg2-binary>=2.9.10"]
mssql = ["mssql-django>=2.0"]

[tool.coverage.run]
source = ["django_rest_aggregation"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ty.src]
# Only the package is typed; tests are not checked.
include = ["src"]
