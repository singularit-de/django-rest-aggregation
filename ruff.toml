line-length = 120

[lint]
# Explicit rule set, so a ruff upgrade does not silently change what is checked.
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "FURB", # refurb
    "PLR1704", # redefined-argument-from-local
    "RUF",
    "ANN",  # flake8-annotations: everything in src/ is typed (tests are not, see per-file-ignores)
]
ignore = [
    "RUF012", # DRF / django-filter configure views and FilterSets with mutable class attributes
    "ANN401", # Any is allowed where values are really arbitrary (serializer fields, *args/**kwargs)
]

[lint.per-file-ignores]
"tests/**" = ["ANN"]
"runtests.py" = ["ANN"]
